<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
    <title>Zoológico Guayson</title>
</head>

<body>
    <h1>Bienvenido al Zoológico Guayson</h1>
    <p>Los mejores animales de Guaymas</p>

    <table>
        <thead>
            <tr>
                <th>Nombre del Animal</th>
                <th>Especie</th>
                <th>Edad</th>
                <th>Color</th>
                <th>Imagen</th>
            </tr>
        </thead>

        <tbody>
            {% for animal in animals %}
            <tr>
                <td>{{ animal.name }}</td>
                <td>{{ animal.species }}</td>
                <td>{{ animal.age }}</td>
                <td>{{ animal.color }}</td>
                <td><img src="{{ animal.image }}" alt="{{ animal.name }}" width="100"></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>

</html>
